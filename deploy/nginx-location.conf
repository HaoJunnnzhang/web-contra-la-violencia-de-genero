# Fragmento NGINX (T05). deploy/instalar.sh sustituye __APP_DIR__ y lo muestra.
# Pégalo dentro del bloque server {} del dominio, ANTES de cualquier
# "location /colaboraciones/" que ya exista. Luego: sudo nginx -t && sudo systemctl reload nginx
#
# Al ser un prefijo más largo y llevar ^~, NGINX elige estas ubicaciones antes que
# la genérica /colaboraciones/.

# ==========================================
# 25N · WEB CONTRA LA VIOLENCIA DE GÉNERO
#
# https://<dominio>/colaboraciones/2026-2027/web-contra-la-violencia-de-genero/
#
#              ↓
#
# http://127.0.0.1:8256/   (gunicorn, servicio systemd 25n-web)
# ==========================================
location = /colaboraciones/2026-2027/web-contra-la-violencia-de-genero {
    return 301 /colaboraciones/2026-2027/web-contra-la-violencia-de-genero/;
}

# Estáticos (CSS, JS, QR, vídeo) servidos directamente por NGINX.
location ^~ /colaboraciones/2026-2027/web-contra-la-violencia-de-genero/static/ {
    alias __APP_DIR__/static/;
    expires 10m;
    access_log off;
}

location ^~ /colaboraciones/2026-2027/web-contra-la-violencia-de-genero/ {
    # La barra final de proxy_pass quita el prefijo antes de pasar la petición.
    proxy_pass http://127.0.0.1:8256/;

    include snippets/proxy-headers.conf;
    # Flask (ProxyFix en wsgi.py) usa esta cabecera para generar las URLs con el prefijo.
    proxy_set_header X-Forwarded-Prefix /colaboraciones/2026-2027/web-contra-la-violencia-de-genero;

    # Los mensajes son texto corto: no hace falta aceptar cuerpos grandes.
    client_max_body_size 64k;
}
